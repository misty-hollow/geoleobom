[project]
name = "geoleobom-data"
version = "0.0.1"
description = "걸어봄 데이터 생성·검증 도구. 기준: docs/걸어봄_확정설계_v2.3.md 부록 C"
requires-python = ">=3.12,<3.13"

# PC 전용이다. 서버는 GeoPackage를 표준 sqlite3로만 읽으므로(v2.3 1-2)
# 이 의존성은 api/ 런타임에 절대 넣지 않는다.
# pyogrio는 0.12.1로 고정한다. 0.13.0에는 cp312 Windows 휠이 없어(cp311-abi3/cp314만)
# Python 3.12 고정(PROJECT.md 3절)과 맞지 않는다.
dependencies = [
    "geopandas==1.1.4",
    "pyogrio==0.12.1",
    "shapely==2.1.2",
    "pyproj==3.7.2",
    "pandas==2.3.3",
    "numpy==2.3.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
