[project]
name = "geoleobom-api"
version = "0.0.1"
description = "걸어봄 API (FastAPI). 계약 기준: docs/걸어봄_확정설계_v2.3.md 4-4"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "cachetools==6.2.0",
    # 런타임이다. app/adapters/osrm.py가 모듈 수준에서 import한다. dev에 두었더니
    # 개발 PC의 editable 설치에서는 늘 있어서 드러나지 않다가, 이미지에서 API가
    # 기동조차 못 했다(ModuleNotFoundError). tests/test_runtime_dependencies.py가
    # 이 종류의 실수를 잡는다.
    "httpx==0.28.1",
]

# 패키지를 명시한다. flat-layout 자동 탐색에 맡기면 최상위에 디렉터리가 하나 더
# 생기는 순간 빌드가 거부된다(data/에서 실제로 겪었다. PR #11). 이미지 빌드는
# 깨끗한 환경에서 비편집 설치를 하므로 그때 처음 드러난다.
[tool.setuptools.packages.find]
include = ["app*"]

# 지원 지역 폴리곤은 파이썬 파일이 아니라서 명시하지 않으면 이미지에 안 실린다.
# 빠지면 /api/analyze가 기동 중 파일 없음으로 죽는다.
[tool.setuptools.package-data]
"app.region_data" = ["*.geojson"]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_osrm: 실제 OSRM 컨테이너가 필요한 검사 (CI에서 제외)",
]
addopts = "-m 'not real_osrm'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
