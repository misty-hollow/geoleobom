[project]
name = "geoleobom-api"
version = "0.0.1"
description = "걸어봄 API (FastAPI). 계약 기준: docs/걸어봄_확정설계_v2.3.md 4-4"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "cachetools==6.2.0",
]

# 패키지를 명시한다. flat-layout 자동 탐색에 맡기면 최상위에 디렉터리가 하나 더
# 생기는 순간 빌드가 거부된다(data/에서 실제로 겪었다. PR #11). 이미지 빌드는
# 깨끗한 환경에서 비편집 설치를 하므로 그때 처음 드러난다.
[tool.setuptools.packages.find]
include = ["app*"]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_osrm: 실제 OSRM 컨테이너가 필요한 검사 (CI에서 제외)",
]
addopts = "-m 'not real_osrm'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
