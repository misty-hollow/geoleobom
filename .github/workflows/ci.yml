name: Repository CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-baseline:
    name: repository-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out tested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check changed-line whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi

      - name: Validate Compose configuration
        run: docker compose -f deploy/compose.yaml config --quiet

      - name: Validate Caddy configuration without starting the site
        run: |
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Scan Git history for secrets
        run: |
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            zricethezav/gitleaks:v8.24.2 \
            git /repo --log-opts=--all --redact=100 --no-banner

      - name: Record validation scope
        run: |
          {
            echo '### Repository baseline'
            echo "Tested revision: $(git rev-parse HEAD)"
            echo 'Passed: changed-line whitespace, Compose config, Caddy config, Git secret scan.'
            echo 'Not tested: product calculations, real OSRM, production deployment, rollback, or branch protection.'
            echo 'Independent review and any required user decision are separate merge conditions.'
          } >> "$GITHUB_STEP_SUMMARY"

  api-checks:
    name: api-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: python -m pip install --quiet ".[dev]"

      - name: Lint and format check
        run: |
          python -m ruff check .
          python -m ruff format --check .

      # real_osrm 마커는 pyproject addopts로 제외된다. 모의·계약 검사만 실행한다.
      - name: Run pytest
        run: python -m pytest -q

  data-checks:
    name: data-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: data
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: python -m pip install --quiet ".[dev]"

      - name: Lint and format check
        run: |
          python -m ruff check .
          python -m ruff format --check .

      # 작은 합성 픽스처만 쓴다. 실데이터·실제 OSRM 빌드는 CI에서 돌리지 않는다.
      - name: Run pytest
        run: python -m pytest -q

  web-build:
    name: web-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit

      - name: Type check and production build
        run: npm run build
