name: Repository CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-baseline:
    name: repository-baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out tested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check changed-line whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BASE_SHA" HEAD
          else
            git show --format= --check HEAD
          fi

      - name: Validate Compose configuration
        run: docker compose -f deploy/compose.yaml config --quiet

      # 배포 스크립트는 서버 상태를 바꾼다. 문법 오류를 병합 전에 잡는다.
      - name: Check deploy shell scripts
        run: |
          for script in deploy/*.sh; do
            bash -n "$script"
          done

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # deploy/*.py는 api·data 어느 패키지에도 속하지 않아 그쪽 검사가 보지 않는다.
      - name: Lint deploy helpers
        run: |
          python -m pip install --quiet "ruff==0.16.7"
          python -m ruff check deploy
          python -m ruff format --check deploy

      - name: Validate Caddy configuration without starting the site
        run: |
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Scan Git history for secrets
        run: |
          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            zricethezav/gitleaks:v8.24.2 \
            git /repo --log-opts=--all --redact=100 --no-banner

      - name: Record validation scope
        run: |
          {
            echo '### Repository baseline'
            echo "Tested revision: $(git rev-parse HEAD)"
            echo 'Passed: changed-line whitespace, Compose config, Caddy config, Git secret scan.'
            echo 'Not tested: product calculations, real OSRM, production deployment, rollback, or branch protection.'
            echo 'Independent review and any required user decision are separate merge conditions.'
          } >> "$GITHUB_STEP_SUMMARY"

  api-checks:
    name: api-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: python -m pip install --quiet ".[dev]"

      - name: Lint and format check
        run: |
          python -m ruff check .
          python -m ruff format --check .

      # real_osrm 마커는 pyproject addopts로 제외된다. 모의·계약 검사만 실행한다.
      - name: Run pytest
        run: python -m pytest -q

  data-checks:
    name: data-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: data
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: python -m pip install --quiet ".[dev]"

      - name: Lint and format check
        run: |
          python -m ruff check .
          python -m ruff format --check .

      # 작은 합성 픽스처만 쓴다. 실데이터·실제 OSRM 빌드는 CI에서 돌리지 않는다.
      - name: Run pytest
        run: python -m pytest -q

  web-build:
    name: web-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-fund --no-audit

      # REST 키 이름이 번들에 실리는 파일에 없는지, SDK·env·좌표 반올림이 각자
      # 한 모듈에만 있는지 (v2.4 4-1, 4-2).
      - name: Check module boundaries
        run: npm run check:boundaries

      # 커밋된 TS 타입이 커밋된 OpenAPI에서 다시 생성한 것과 같은지 (v2.4 4-1).
      # OpenAPI 자체가 앱과 같은지는 api-checks의 test_openapi_export.py가 본다.
      # 두 검사 모두 필수라 한쪽만 고치고 병합할 수 없다.
      # 추적되지 않은 파일은 `git diff`에 나오지 않는다 — 타입이 커밋되지 않았다면
      # 이 검사는 **아무것도 확인하지 않고 통과한다.** 먼저 추적 여부를 못박는다.
      - name: Regenerate API types and require no diff
        run: |
          git ls-files --error-unmatch src/api/schema.ts > /dev/null || {
            echo '::error::src/api/schema.ts가 커밋되지 않았다. 생성 결과를 커밋해야 이 검사가 의미를 가진다.'
            exit 1
          }
          npm run gen:api
          git diff --exit-code -- src/api/schema.ts || {
            echo '::error::생성된 API 타입이 커밋된 것과 다르다. `npm run gen:api` 결과를 커밋해라.'
            exit 1
          }

      - name: Type check and production build
        run: npm run build

      # 좌표 정규화·비교 강조 규칙·상태 매핑·후보 저장·검색 디바운스·지도 훅은 손계산
      # 픽스처로 검사한다(vitest + jsdom). 모의 응답이므로 실제 OSRM·실데이터 검증이 아니다.
      - name: Run frontend tests
        run: npm test

      # **센티널 값으로 실제 빌드를 돌려** REST 키가 번들에 없는지 확인한다.
      # 대조군(VITE_ JS 키는 번들에 있어야 한다)이 함께 들어 있어, 스캔이 아무것도
      # 못 찾는 상태가 통과로 보이지 않는다 (v2.4 4-1, 5절).
      - name: Prove the REST key never reaches the bundle
        run: npm run check:bundle
